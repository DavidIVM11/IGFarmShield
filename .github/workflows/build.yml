name: Build IGFarmShield Rootless DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Theos (Fast Mode)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          brew install ldid xz dpkg
          export THEOS=~/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          fi
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Generate Icon, Fix Tabs & Build DEB
        run: |
          python3 -c '
          for path in ["Makefile", "igfarmshieldprefs/Makefile"]:
              with open(path, "r") as f:
                  lines = f.readlines()
              fixed = []
              in_rule = False
              for line in lines:
                  if line.strip().endswith("::") or line.strip().endswith(":"):
                      in_rule = True
                      fixed.append(line)
                  elif in_rule and (line.startswith("    ") or line.startswith("\t")):
                      fixed.append("\t" + line.lstrip())
                  else:
                      if line.strip() == "":
                          in_rule = False
                      fixed.append(line)
              with open(path, "w") as f:
                  f.writelines(fixed)
          '
          make clean
          make package FINALPACKAGE=1

      - name: Upload Compiled DEB
        uses: actions/upload-artifact@v4
        with:
          name: IGFarmShield-Rootless-DEB
          path: packages/*.deb
