name: Build IGFarmShield Rootless

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          brew update
          brew install ldid xz dpkg

      - name: Setup Theos and iOS 16.5 SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          gh release download --repo theos/sdks --pattern "iPhoneOS16.5.sdk.tar.xz" --dir "$RUNNER_TEMP" || gh release download --repo theos/sdks --pattern "iPhoneOS15*.sdk.tar.xz" --dir "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP"/iPhoneOS*.sdk.tar.xz -C "$THEOS/sdks"
          rm -f "$RUNNER_TEMP"/iPhoneOS*.sdk.tar.xz

      - name: Normalize line endings and compile rootless package
        run: |
          find . -type f \( -name "Makefile" -o -name "*.mk" -o -name "control" -o -name "*.plist" -o -name "*.x" -o -name "*.m" \) -exec perl -pi -e 's/\r\n/\n/g' {} +
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless THEOS_PACKAGE_COMPRESSION=xz

      - name: Upload compiled DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGFarmShield-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
