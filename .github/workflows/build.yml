name: Build IGFarmShield Rootless DEB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        uses: theos/actions/install-theos@v1
        with:
          sdks: '15.2'

      - name: Build Package (.deb)
        run: |
          source $GITHUB_WORKSPACE/.theosrc || true
          export THEOS=~/theos
          make package FINALPACKAGE=1

      - name: Upload Compiled .deb
        uses: actions/upload-artifact@v4
        with:
          name: IGFarmShield-Rootless-DEB
          path: packages/*.deb
